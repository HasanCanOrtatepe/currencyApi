# T34 Faz 7 — sahte kur satıcısı.
# Config Server'dan OKUMAZ ve Eureka'ya KAYDOLMAZ: bu servis CRM'in bir parçası değil, taklit
# ettiği dış dünyanın parçasıdır. Ayarları kendi imajındadır (config-server/discovery-server
# emsali — onlar da config client değildir).
server:
  port: 8095

spring:
  application:
    name: currency-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.ohbsy.currencyapi: INFO
