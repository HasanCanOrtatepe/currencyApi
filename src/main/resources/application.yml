# TCMB tabanlı kur servisi.
# Config Server'dan OKUMAZ ve Eureka'ya KAYDOLMAZ: bağımsız bir mikroservistir ve ayarları
# kendi imajındadır. Tüketicileri onu URL ile bulur.
server:
  port: 8095

spring:
  application:
    name: currency-api
  data:
    redis:
      # Yalnız currency-api.cache.type=redis iken kullanılır.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s          # Redis alt saniyede cevap verir; 2 sn zaten cömert bir üst sınırdır
                           # ve erişilemezlikte isteği dakikalarca bekletmez (fail-open ancak
                           # hızlı düşerse işe yarar).

currency-api:
  cache:
    # memory | redis — çok instance'lı kurulumda redis olmalıdır (kur paylaşılan durumdur).
    type: ${CURRENCY_CACHE_TYPE:memory}
    # TAZELİK penceresi: içindeyken TCMB'ye HİÇ gidilmez.
    ttl: 15m
    # SAKLAMA süresi: tazelik dolsa da kayıt silinmez, "son geçerli kur" olarak durur.
    # Hafta sonu + resmî tatil zincirlerini kapsar.
    retention: 7d
  tcmb:
    base-url: ${TCMB_BASE_URL:https://www.tcmb.gov.tr}
    connect-timeout: 5s
    read-timeout: 10s
  auth:
    # Varsayılan KAPALI: açık gelseydi anahtar tanımlamamış her kurulum bir anda 401 alırdı.
    # Açıldığında anahtarsız istek kesinlikle reddedilir; anahtar tanımlı değilse servis
    # AÇILIŞTA düşer (sessizce her şeyi 401'lemesindense gürültülü hata).
    enabled: ${CURRENCY_AUTH_ENABLED:false}
    # "anahtar=tuketici,anahtar2=tuketici2" — DEĞER YALNIZ ORTAM DEĞİŞKENİNDEN gelir; buraya
    # gerçek bir anahtar yazmak onu depoya sokmak demektir ve geri alınamaz.
    #
    # Map anahtarı olarak YAZILAMAZ: YAML'de map ANAHTARI içindeki ${ENV} yer tutucusu
    # çözülmez ve doğru anahtarla gelen istek bile 401 alır (ölçülerek öğrenildi).
    key-spec: ${CURRENCY_API_KEYS:}
  rate-limit:
    enabled: true
    # Cömert: cache'ini kullanan tüketici saatte ~4 istek atar, bu sınıra yaklaşmaz.
    # Sınır, cache'i devre dışı kalan ya da döngüye giren tüketici içindir.
    limit: ${CURRENCY_RATE_LIMIT:120}
    window: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    redis:
      # KAPALI — bilinçli. Cache bir HIZLANDIRICIDIR, bağımlılık değil: Redis erişilemezken
      # servis kuru sağlayıcıdan çekmeye devam eder (fail-open). Redis göstergesi açık
      # bırakılsaydı sağlık ucu DOWN'a düşer, orkestratör de kur sunabilen sağlıklı bir
      # instance'ı öldürür ya da yük dengeleyiciden düşürürdü — yani cache kesintisi
      # SERVİS kesintisine terfi ederdi. Sağlık ucu "kur sunabiliyor muyum" sorusunu
      # cevaplamalıdır, "cache'im ayakta mı" sorusunu değil.
      enabled: false

logging:
  level:
    com.ohbsy.currencyapi: INFO
