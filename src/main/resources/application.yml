# TCMB tabanlı kur servisi.
# Config Server'dan OKUMAZ ve Eureka'ya KAYDOLMAZ: bağımsız bir mikroservistir ve ayarları
# kendi imajındadır. Tüketicileri onu URL ile bulur.
server:
  port: 8095

spring:
  application:
    name: currency-api
  data:
    redis:
      # Yalnız currency-api.cache.type=redis iken kullanılır.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s          # Redis alt saniyede cevap verir; 2 sn zaten cömert bir üst sınırdır
                           # ve erişilemezlikte isteği dakikalarca bekletmez (fail-open ancak
                           # hızlı düşerse işe yarar).

currency-api:
  cache:
    # memory | redis — çok instance'lı kurulumda redis olmalıdır (kur paylaşılan durumdur).
    type: ${CURRENCY_CACHE_TYPE:memory}
    # TAZELİK penceresi: içindeyken TCMB'ye HİÇ gidilmez.
    ttl: 15m
    # SAKLAMA süresi: tazelik dolsa da kayıt silinmez, "son geçerli kur" olarak durur.
    # Hafta sonu + resmî tatil zincirlerini kapsar.
    retention: 7d
  tcmb:
    base-url: ${TCMB_BASE_URL:https://www.tcmb.gov.tr}
    connect-timeout: 5s
    read-timeout: 10s
  evds:
    # TCMB'nin veri dağıtım sistemi — zincirin İLK basamağı (bkz. ChainedExchangeRateProvider).
    # today.xml ile AYNI kurumun AYNI resmî satış kurudur; farkı, her satırı kendi günüyle
    # vermesidir. today.xml'in Tarih özniteliği bir gün geriden gelir ve "elimizdeki kur
    # bugünün mü" sorusu onunla cevaplanamaz.
    base-url: ${CURRENCY_EVDS_BASE_URL:https://evds3.tcmb.gov.tr}
    # ANAHTAR AYNI ZAMANDA DÜĞMEDİR: boşsa EVDS zincire hiç girmez ve servis bugünkü
    # davranışını (yalnız today.xml) aynen sürdürür. Ayrı bir enabled bayrağı YOKTUR —
    # "açık ama anahtarsız" diye çelişkili bir yapılandırma kurulamasın diye.
    # DEĞER YALNIZ ORTAM DEĞİŞKENİNDEN gelir; buraya yazmak onu depoya sokmaktır.
    key: ${CURRENCY_EVDS_KEY:}
    # Tek gün değil ARALIK sorulur, en yeni DOLU gün seçilir: hafta sonu ve tatillerde EVDS
    # satırı verir ama değerleri boştur. 10 gün en uzun bayram zincirini kapsar.
    lookback: 10d
    connect-timeout: 5s
    read-timeout: 10s
  ecb:
    # Avrupa Merkez Bankası — zincirin SON basamağı ve tek BAĞIMSIZ kaynağı.
    #
    # EVDS ile today.xml aynı KURUMUN iki kapısıdır: o kurum erişilemez olduğunda ikisi birden
    # düşer. ECB farklı bir kurum/altyapı/ülkedir; birlikte düşmeleri için ortak sebep yoktur.
    #
    # HAFTA SONUNU ÇÖZMEZ: ECB de hafta sonu yayın yapmaz. Yayın boşluğunun cevabı cache'in
    # 7 günlük saklama penceresidir (son geçerli kur). Dahası sağlayıcı hafta sonu bilinçle
    # SUSAR — yalnız BUGÜNÜN belgesini kabul eder, yoksa her cumartesi sunulan kur TCMB'den
    # ECB'ye atlar ve hiçbir şey bozulmadığı hâlde rakam kurum değiştirirdi.
    #
    # VARSAYILAN KAPALI: açıldığında sunulan sayı başka bir kurumun kuru olabilir (ECB referans
    # kuru ≠ TCMB resmî satış kuru). Görünürdür (cevapta provider: "ecb") ama yine de bir
    # davranış değişikliğidir; bilmeyen bir kurulum imaj güncellemesiyle devralmamalıdır.
    enabled: ${CURRENCY_ECB_ENABLED:false}
    base-url: ${CURRENCY_ECB_BASE_URL:https://www.ecb.europa.eu}
    connect-timeout: 5s
    read-timeout: 10s
  auth:
    # Varsayılan KAPALI: açık gelseydi anahtar tanımlamamış her kurulum bir anda 401 alırdı.
    # Açıldığında anahtarsız istek kesinlikle reddedilir; anahtar tanımlı değilse servis
    # AÇILIŞTA düşer (sessizce her şeyi 401'lemesindense gürültülü hata).
    enabled: ${CURRENCY_AUTH_ENABLED:false}
    # "anahtar=tuketici,anahtar2=tuketici2" — DEĞER YALNIZ ORTAM DEĞİŞKENİNDEN gelir; buraya
    # gerçek bir anahtar yazmak onu depoya sokmak demektir ve geri alınamaz.
    #
    # Map anahtarı olarak YAZILAMAZ: YAML'de map ANAHTARI içindeki ${ENV} yer tutucusu
    # çözülmez ve doğru anahtarla gelen istek bile 401 alır (ölçülerek öğrenildi).
    key-spec: ${CURRENCY_API_KEYS:}
  rate-limit:
    enabled: true
    # Cömert: cache'ini kullanan tüketici saatte ~4 istek atar, bu sınıra yaklaşmaz.
    # Sınır, cache'i devre dışı kalan ya da döngüye giren tüketici içindir.
    limit: ${CURRENCY_RATE_LIMIT:120}
    window: 1m
    # Anonim isteğin adresini taşıyan başlık. VARSAYILAN BOŞ = başlığa güvenilmez.
    #
    # Tünel arkasında getRemoteAddr() HER internet isteği için aynı adresi verir (ölçüldü:
    # remote=10.89.0.3) — yani "kota IP başına" sözü boşa düşer ve tek bir çağıran anahtarsız
    # önizleme ucunu herkese 429 yaptırabilir. Üretimde CF-Connecting-IP verilir: o başlığı
    # cloudflared kendisi YAZAR, tünelden geçen istemci uyduramaz.
    #
    # Portu doğrudan güvenilmeyen bir ağa açan bir kurulumda BOŞ BIRAKILMALIDIR: orada başlık
    # uydurulabilir ve sınır her istekte yeni bir kimlikle atlatılabilirdi.
    client-ip-header: ${CURRENCY_CLIENT_IP_HEADER:}
  admin:
    # Varsayılan KAPALI — Auth.enabled ile aynı gerekçe, artı: bu servisin CANLI bir kurulumu
    # varsa, özelliğin eklendiği bir imaj güncellemesi .env güncellenmeden o kurulumu kırmasın.
    enabled: ${CURRENCY_ADMIN_ENABLED:false}
    # /admin/** BU token'i ister (X-Admin-Token). Depoya YAZILMAZ, yalnız ortam değişkeninden.
    token: ${CURRENCY_ADMIN_TOKEN:}
    # /admin/** YALNIZ bu portta sunulur, server.port'ta (8095) DEĞİL — Cloudflare tunnel
    # yalnız 8095'i ileriye taşır; admin uçlarının aynı portta durması, path filtreden
    # bağımsız olarak onları internete açardı (tunnel path değil TÜM portu yönlendirir).
    port: ${CURRENCY_ADMIN_PORT:8097}
    # Angular admin-ui'nin izinli origin'leri — yalnız /admin/** için CORS izni.
    #
    # Önceki değer http://*:8096 idi (host SERBEST) ve panel LAN'a açıkken gerekiyordu; panel
    # loopback'e çekildikten sonra o gevşeklik yalnız kâğıt üzerinde kaldı. Tarayıcı adres
    # çubuğuna localhost da 127.0.0.1 de yazılabildiği için İKİSİ birden listelenir: yalnız
    # biri olsaydı, kullanıcının hangi yazımı seçtiğine göre panel sessizce çalışmazdı.
    cors-origin-pattern: ${CURRENCY_ADMIN_CORS_ORIGIN_PATTERN:http://localhost:8096,http://127.0.0.1:8096}
  simulator:
    # Sahte satıcı yüzeyi (/kurlar/**, /stats/**) ve kaos uçları (/__mode, /__settings, /__reset).
    # Varsayılan KAPALI: kaos uçları anahtar İSTEMEZ (kaosu süren duman testinin elinde anahtar
    # yoktur) ve durum DEĞİŞTİRİR. İnternete açılmış bir serviste bu ikisi bir arada, uzaktan
    # erişilebilir bir arıza düğmesidir. Yalnız tüketici testlerinde açılır.
    enabled: ${CURRENCY_SIMULATOR_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        # VARSAYILAN YALNIZ health — bilinçli daraltma. Önce health,info,metrics idi ve bu,
        # tünelin taşıdığı public portta ölçülerek doğrulanmış bir sızıntıydı:
        # /actuator/metrics anahtarsız cevap veriyor, jvm.info ile JDK sürümünü (CVE eşlemesi),
        # disk.free ile makine bilgisini, http.server.requests ile tüm uç listesini ve istek
        # sayılarını dışarı veriyordu. Sağlık ucu orkestratör için gereklidir ve zaten
        # detaysızdır (show-details: when-authorized).
        #
        # Metrik gerekiyorsa YALNIZ loopback'e bağlı admin instance'ında açılır
        # (CURRENCY_ACTUATOR_EXPOSE=health,info,metrics) — orada da ApiGuardFilter anahtar ister.
        include: ${CURRENCY_ACTUATOR_EXPOSE:health}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    redis:
      # KAPALI — bilinçli. Cache bir HIZLANDIRICIDIR, bağımlılık değil: Redis erişilemezken
      # servis kuru sağlayıcıdan çekmeye devam eder (fail-open). Redis göstergesi açık
      # bırakılsaydı sağlık ucu DOWN'a düşer, orkestratör de kur sunabilen sağlıklı bir
      # instance'ı öldürür ya da yük dengeleyiciden düşürürdü — yani cache kesintisi
      # SERVİS kesintisine terfi ederdi. Sağlık ucu "kur sunabiliyor muyum" sorusunu
      # cevaplamalıdır, "cache'im ayakta mı" sorusunu değil.
      enabled: false

logging:
  level:
    com.ohbsy.currencyapi: INFO
  pattern:
    # Correlation ID her satıra basılır (CorrelationIdFilter MDC'ye koyar). Tüketicinin
    # logundaki kimlikle bizimki böyle eşleşir; olmadığında iki logu zaman damgasıyla
    # gözle hizalamak gerekirdi. Filtre dışında üretilen satırlarda alan boş kalır.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:--}] %logger{36} -- %msg%n"
