<div class="login-page">
  <form class="login-card" (ngSubmit)="submit()">
    <div class="card-head">
      <span class="seal" aria-hidden="true"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><circle cx="24" cy="24" r="22" stroke="#BE9349" stroke-width="1.5" fill="none"/><circle cx="24" cy="24" r="18" stroke="#BE9349" stroke-width="0.75" opacity="0.45" fill="none"/><g stroke="#DDB86A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M16 20h14"/><path d="M27 17l3 3-3 3"/><path d="M32 28H18"/><path d="M21 25l-3 3 3 3"/></g></svg></span>
      <div class="head-text">
        <span class="title">Pair 3 Kur Servisi</span>
        <span class="sub">Anahtar Yönetimi</span>
      </div>
    </div>

    <p class="kicker">Yetkili Erişim</p>
    <h1>Panele giriş</h1>
    <p class="hint">Anahtar yönetimi için admin token'ınızı girin.</p>

    <label class="field-label" for="token">Admin Token</label>
    <input
      id="token"
      class="field-input"
      type="password"
      name="token"
      [(ngModel)]="token"
      autocomplete="off"
      placeholder="X-Admin-Token"
    />

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary submit" [disabled]="checking()">
      {{ checking() ? 'Kontrol ediliyor…' : 'Giriş yap' }}
    </button>

    <p class="foot">Bu panel yalnız bu makineden erişilebilir.</p>
  </form>
</div>
