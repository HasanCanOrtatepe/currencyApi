server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tarayıcılar /favicon.ico'yu SAYFADA BEYAN EDİLMESE BİLE kendiliğinden ister. Aşağıdaki
    # SPA fallback'i devrede olduğu için bu istek index.html'i döndürüyordu: tarayıcı "ikon"
    # diye HTML alıyor ve sekmede bozuk/boş bir ikon gösteriyordu. İkonumuz SVG olarak beyan
    # edildiğinden burada içerik yok (204) demek doğru cevaptır.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Varlıklar SPA fallback'ine DÜŞMEZ. Düşerlerse eksik/yanlış yazılmış bir dosya yolu
    # 404 yerine 200 + HTML döner ve hata "Unexpected token '<'" gibi asıl sebebi gizleyen
    # bir yerde patlar. Varlık yoksa 404 demek, arızayı olduğu yerde gösterir.
    location ~* \.(?:js|mjs|css|map|svg|png|jpe?g|gif|ico|webp|woff2?|ttf|eot|json|txt)$ {
        try_files $uri =404;
        access_log off;
    }

    # SPA fallback yalnız SAYFA yolları için: Angular router'ın tanıdığı /keys gibi yollar
    # dosya sisteminde yoktur, yönlendirmeyi uygulamanın kendisi yapar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
