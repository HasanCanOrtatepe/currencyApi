server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: Angular router'ın tanıdığı yollar (ör. /keys) dosya sistemine karşılık
    # gelmez, hepsi index.html'e düşer ve yönlendirmeyi Angular kendi yapar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
