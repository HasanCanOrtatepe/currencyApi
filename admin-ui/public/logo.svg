<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Pair 3 Kur Servisi">
  <!--
    Mühür — iki KARŞIT ok, "pair" fikrini birebir taşır ve aynı anda kur çevriminin
    kendisidir (TRY→döviz, döviz→TRY: servisin `rate`/`unitPrice` çiftinin görsel karşılığı).
    Çift halka mühür/damga dilini kurar; tanıtım sayfasının pirinç aksanıyla aynı renklerdir.
    Simetriktir: 180° döndürüldüğünde kendisine eşittir.
  -->
