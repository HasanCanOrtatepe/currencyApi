# currency-api — KALICI SUNUCU olarak çalıştırma.
#
# Bu dosyanın varlık sebebi, servisin tüketicisinden BAĞIMSIZ yaşayabilmesidir. CRM'in kendi
# compose'unda da bir `currency-api` bloğu vardır ama o blok geliştirme kolaylığı içindir:
# kaynağı yerel bir yoldan derler ve CRM yığınıyla birlikte doğar/ölür. Servis gerçekten bir
# "dış hizmet" gibi davranacaksa tüketicinin yaşam döngüsüne bağlı OLMAMALIDIR — yoksa
# "dış hizmete bağımlı değiliz" iddiası, dış hizmeti kendimiz ayakta tuttuğumuz için sınanmamış
# kalır.
#
#   podman compose up -d --build      # http://<bu-makine>:8095
#
# Tüketici tarafında (CRM) tek değişiklik base URL'dir:
#   CRM_CURRENCY_PROVIDER=currencyapi
#   CRM_CURRENCY_CURRENCYAPI_BASE_URL=http://<bu-makine>:8095
#   CRM_CURRENCY_CURRENCYAPI_API_KEY=<CURRENCY_CRM_KEY ile aynı>

services:
  redis:
    image: redis:7
    mem_limit: 128m
    # KALICILIK AÇIK — bilinçli. Cache burada yalnız bir hızlandırıcı değildir: `retention`
    # penceresi (7g) hafta sonu ve resmî tatillerde "son geçerli kur"u taşıyan güvenlik ağıdır.
    # Bellekte tutulsaydı cumartesi günü bir yeniden başlatma o ağı silerdi ve servis, TCMB
    # yayın yapmadığı için pazartesiye kadar kursuz kalırdı — yani en çok ihtiyaç duyulan anda.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - currency-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  currency-api:
    build:
      context: .
      dockerfile: Containerfile
    mem_limit: 384m
    depends_on:
      redis:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+ExitOnOutOfMemoryError"
      CURRENCY_CACHE_TYPE: redis
      REDIS_HOST: redis
      # Boş bırakılırsa servisin kendi varsayılanı (gerçek TCMB) geçerlidir.
      TCMB_BASE_URL: ${TCMB_BASE_URL:-}
      # EVDS anahtarı — kur zincirinin ilk basamağı. Boş bırakılabilir: o zaman zincir yalnız
      # today.xml'den oluşur ve servis çalışmaya devam eder, yalnız bülten tarihi bir gün
      # geriden gelir. Anahtar .env'den gelir, bu dosyaya YAZILMAZ.
      CURRENCY_EVDS_KEY: ${CURRENCY_EVDS_KEY:-}
      # ANAHTAR DOĞRULAMASI BURADA VARSAYILAN OLARAK AÇIKTIR ve CRM'in compose'undaki
      # varsayılandan (kapalı) bilinçli olarak ayrılır: orada servis yalnız compose ağında
      # görünür, burada ise 8095 makinenin ağ arayüzünde durur. Ağa açılan bir uç, anahtarsız
      # bırakılırsa aynı ağdaki herkesin TCMB kotamızı harcayabileceği bir uçtur.
      CURRENCY_AUTH_ENABLED: ${CURRENCY_AUTH_ENABLED:-true}
      # "anahtar=tuketici,anahtar2=tuketici2" — .env'den gelir, bu dosyaya YAZILMAZ.
      # Auth açık ve hiç anahtar tanımlı değilse servis AÇILIŞTA düşer (sessizce her isteği
      # 401'lemektense gürültülü hata).
      CURRENCY_API_KEYS: ${CURRENCY_API_KEYS:-}
      CURRENCY_RATE_LIMIT: ${CURRENCY_RATE_LIMIT:-120}
      # Hız sınırı kimliği bu başlıktan okunur. Konteynere gelen bağlantının kaynağı TÜM
      # internet trafiği için aynıdır (ölçüldü: remote=10.89.0.3), yani başlıksız kurulumda
      # "kota IP başına" pratikte "kota TÜM DÜNYAYA tek kova" demekti: tek bir çağıran,
      # anahtarsız önizleme ucunu dakikada 120 istekle herkese 429 yaptırabiliyordu.
      # CF-Connecting-IP'yi cloudflared her istekte kendisi yazar; tünelden uydurulamaz.
      # Bu portu tünelsiz, doğrudan güvenilmeyen bir ağa açan bir kurulum bunu BOŞ bırakmalıdır.
      CURRENCY_CLIENT_IP_HEADER: ${CURRENCY_CLIENT_IP_HEADER:-CF-Connecting-IP}
    ports:
      # 8095'i LAN'a açar. İNTERNETE yönlendirmeyin: anahtar düz HTTP üzerinde açık gider ve
      # yol boyunca okunabilir. Dışarı açılacaksa önüne TLS sonlandıran bir ters vekil konur.
      - "8095:8095"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8095 && printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Makine yeniden başlasa da servis geri gelsin: "sürekli çalışan sunucu" iddiasının
    # tek bir el müdahalesine bağlı olmaması gerekir.
    restart: unless-stopped

  # AYRI bir container, AYNI imaj — admin API'sini (/admin/keys) yalnız burada açar.
  #
  # Neden ayrı container: currency-api yukarıda genellikle bir tünelle (ör. Cloudflare quick
  # tunnel) internete açılır ve tünel TÜM portu yönlendirir, path bazlı bir filtre yeterli
  # olmaz. Admin uçlarını AYRI bir portta, ayrı bir container'da çalıştırmak — tünelin hiç
  # bilmediği bir port olduğu için — admin yüzeyini yapısal olarak internetten erişilemez
  # kılar. İkisi de aynı Redis'i paylaşır, dolayısıyla burada oluşturulan bir anahtar public
  # instance'ta anında geçerlidir.
  currency-api-admin:
    build:
      context: .
      dockerfile: Containerfile
    mem_limit: 384m
    depends_on:
      redis:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: ${CURRENCY_ADMIN_PORT:-8097}
      CURRENCY_CACHE_TYPE: redis
      REDIS_HOST: redis
      CURRENCY_ADMIN_ENABLED: "true"
      # Bos birakilirsa currency-api-admin ACILISTA duser (admin.enabled=true + bos token).
      CURRENCY_ADMIN_TOKEN: ${CURRENCY_ADMIN_TOKEN:-}
      CURRENCY_ADMIN_PORT: ${CURRENCY_ADMIN_PORT:-8097}
      # Loopback çifti — host serbest (http://*:8096) DEĞİL. Panel yalnız loopback'e bağlıyken
      # host'u serbest bırakmak, kullanılmayan bir izni açık tutmaktan başka bir şey değildi.
      CURRENCY_ADMIN_CORS_ORIGIN_PATTERN: ${CURRENCY_ADMIN_CORS_ORIGIN_PATTERN:-http://localhost:8096,http://127.0.0.1:8096}
      # Metrikler YALNIZ burada açıktır: bu konteyner loopback'e bağlıdır, public olan değil.
      # /actuator/metrics burada da anahtarsız DEĞİLDİR (ApiGuardFilter yalnız /actuator/health'i
      # muaf tutar) — loopback + anahtar, iki katman.
      CURRENCY_ACTUATOR_EXPOSE: ${CURRENCY_ACTUATOR_EXPOSE:-health,info,metrics}
      CURRENCY_AUTH_ENABLED: ${CURRENCY_AUTH_ENABLED:-true}
      CURRENCY_API_KEYS: ${CURRENCY_API_KEYS:-}
      CURRENCY_RATE_LIMIT: ${CURRENCY_RATE_LIMIT:-120}
      # Bu instance da kur sunar (aynı imaj, aynı Redis cache'i) — zinciri public instance ile
      # AYNI tutmak gerekir, yoksa cache'i hangisinin doldurduğuna göre bülten tarihi oynardı.
      CURRENCY_EVDS_KEY: ${CURRENCY_EVDS_KEY:-}
    ports:
      # YALNIZ LOOPBACK. Önce tüm arayüzlere bağlıydı ("LAN'dan da yönetebileyim") ama bu,
      # sabit bir ev ağı varsayımıydı: burası bir DİZÜSTÜ ve kafede/otelde/okulda bir Wi-Fi'a
      # bağlandığı anda admin yüzeyi o ağdaki herkese açılırdı — üstelik token LAN'da düz HTTP
      # ile gider (tünel yalnız 8095'i TLS'ler) ve makinenin güvenlik duvarı kapalıdır.
      # Başka bir cihazdan yönetmek gerekirse SSH tüneli kullanılır:
      #   ssh -L 8097:127.0.0.1:8097 -L 8096:127.0.0.1:8096 <kullanici>@<bu-makine>
      - "127.0.0.1:${CURRENCY_ADMIN_PORT:-8097}:${CURRENCY_ADMIN_PORT:-8097}"
    healthcheck:
      # /actuator/health anahtar İSTEMEZ (ApiGuardFilter muafiyeti) — orkestratörün elinde
      # admin token'ı yoktur. Sağlıksızlığı görmenin başka yolu olmazdı: restart yalnız süreç
      # ÖLDÜĞÜNDE devreye girer, "ayakta ama cevap vermiyor" durumunu yakalamaz.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/${CURRENCY_ADMIN_PORT:-8097} && printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Angular admin paneli — currency-api-admin'in (8097) üstüne ince bir arayüz. Kendi imajı,
  # kendi yaşam döngüsü (pom.xml'in frontend/ için belirttiği bağımsızlık ilkesiyle aynı
  # gerekçe). Admin API ile AYNI gerekçeyle yalnız loopback'e bağlanır.
  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Containerfile
    mem_limit: 64m
    depends_on:
      - currency-api-admin
    ports:
      # Yalnız loopback — bkz. currency-api-admin'deki gerekçe.
      - "127.0.0.1:8096:80"
    healthcheck:
      # nginx:alpine'de curl yok; wget BusyBox ile gelir.
      #
      # ADRES 127.0.0.1 OLMALI, "localhost" DEĞİL: BusyBox wget localhost'u önce IPv6'ya
      # (::1) çözer, nginx ise `listen 80` ile yalnız IPv4'e bağlanır — bağlantı reddedilir
      # ve konteyner, dışarıdan gayet çalışırken "unhealthy" görünür. (Ölçülerek bulundu:
      # healthcheck eklendiğinden beri 44 ardışık başarısızlık.)
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  currency-redis:
